name: Build and deploy JAR app to Azure Web App - app-api-gateway-chamadas

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: 'maven'

      # Os testes rodam antes do deploy: se algum falhar, nada vai para o Azure
      - name: Build and test with Maven
        run: mvn -B clean verify
        working-directory: api-gateway

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: |
            api-gateway/target/*.jar
            !api-gateway/target/*.jar.original

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B425047C875A4DC8AB20A566E57D264B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3887A73102234090A0DF16C18BB74BD6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D8A9DEE415C947C3B70C4CAF48D5C7BA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-api-gateway-chamadas'
          slot-name: 'Production'
          package: '*.jar'
