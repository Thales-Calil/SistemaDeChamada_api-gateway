server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

  # Banco de usuários do Gateway (Azure SQL). Sem valores padrão: a aplicação
  # não sobe se as variáveis não estiverem configuradas no App Service.
  datasource:
    url: ${GATEWAY_DB_URL}
    username: ${GATEWAY_DB_USER}
    password: ${GATEWAY_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000

  # Flyway cria/atualiza a tabela de usuários a partir de src/main/resources/db/migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # Suporte a CORS centralizado no Gateway (Origens Explícitas)
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              # --- AMBIENTE LOCAL (Host + MFEs) ---
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:3002"
              - "http://localhost:4000"
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:3001"
              - "http://127.0.0.1:3002"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:5174"
              # --- NUVEM (Host Azure Static Web Apps) ---
              - "https://jolly-wave-02fe61f0f.5.azurestaticapps.net"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: false
            max-age: 3600

      # Mapeamento de Rotas do Reverse Proxy
      routes:
        # Rota 1: Aluno Service (MongoDB Atlas) -> :8081
        - id: aluno-service-route
          uri: ${services.aluno.url:http://localhost:8081}
          predicates:
            - Path=/api/alunos/**
          filters:
            - AddResponseHeader=X-Gateway-Route, aluno-service

        # Rota 2: Chamada Service (Azure SQL) -> :8082
        - id: chamada-service-route
          uri: ${services.chamada.url:http://localhost:8082}
          predicates:
            - Path=/api/chamadas/**, /api/presencas/**
          filters:
            - AddResponseHeader=X-Gateway-Route, chamada-service

        # Rota 3: Turma Service (Azure SQL) -> :8083
        - id: turma-service-route
          uri: ${services.turma.url:http://localhost:8083}
          predicates:
            - Path=/api/turmas/**, /api/professores/**, /api/disciplinas/**
          filters:
            - AddResponseHeader=X-Gateway-Route, turma-service

        # Rotas proxy OpenAPI / Swagger dos microsserviços
        - id: aluno-service-api-docs
          uri: ${services.aluno.url:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/aluno-service
          filters:
            - RewritePath=/v3/api-docs/aluno-service, /v3/api-docs

        - id: chamada-service-api-docs
          uri: ${services.chamada.url:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/chamada-service
          filters:
            - RewritePath=/v3/api-docs/chamada-service, /v3/api-docs

        - id: turma-service-api-docs
          uri: ${services.turma.url:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/turma-service
          filters:
            - RewritePath=/v3/api-docs/turma-service, /v3/api-docs

# URLs base dos microsserviços para consumo interno do BFF
services:
  aluno:
    url: ${ALUNO_SERVICE_URL:http://localhost:8081}
  chamada:
    url: ${CHAMADA_SERVICE_URL:http://localhost:8082}
  turma:
    url: ${TURMA_SERVICE_URL:http://localhost:8083}

# Documentação OpenAPI / Swagger UI agregada
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    urls:
      - name: 1. Aluno Service
        url: /v3/api-docs/aluno-service
      - name: 2. Chamada Service
        url: /v3/api-docs/chamada-service
      - name: 3. Turma Service
        url: /v3/api-docs/turma-service

# Segurança do JWT (1.2): o segredo vem SOMENTE da variável de ambiente JWT_SECRET
# (mínimo 32 caracteres). Se não estiver definida, a aplicação não inicia.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:28800000} # 8 horas

# Usuário administrador criado automaticamente na primeira subida (se não existir nenhum ADMIN)
app:
  admin-inicial:
    username: ${ADMIN_INITIAL_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:}

# Actuator (1.3): apenas o health é exposto. O endpoint "gateway" permitia
# criar/alterar rotas pela internet e foi desabilitado.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    gateway:
      enabled: false
    health:
      show-details: never

# Configuração de Logs
logging:
  level:
    root: INFO
    com.sistemadechamada_apigateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: INFO
